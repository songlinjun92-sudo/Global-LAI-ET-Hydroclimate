[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-lai-et-hydroclimate"
version = "0.1.0"
description = "Reproducible global LAI-ET hydroclimatic sensitivity analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Linjun Song"}]
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.0,<3", "scipy>=1.11,<2",
 "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "PyYAML>=6,<7",
 "matplotlib>=3.8,<4", "rasterio>=1.3,<2", "xarray>=2023.1",
 "h5netcdf>=1.3", "statsmodels>=0.14,<1"
]
[project.optional-dependencies]
shap = ["shap>=0.46,<1"]
test = ["pytest>=8,<10"]
[project.scripts]
lai-et = "lai_et.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
